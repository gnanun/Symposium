<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Symposium 2.0 Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/admin.css">
</head>
<body>

<div class="admin-shell">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <span class="brand-mark">CC</span>
      <div><strong>Symposium 2.0</strong><small>Admin Panel</small></div>
    </div>
    <nav class="sidebar-nav" id="sidebarNav">
      <a href="#overview" data-section="overview" class="active">Overview</a>
      <a href="#events" data-section="events">Events</a>
      <a href="#registrationsHub" data-section="registrationsHub">Registrations</a>
      <a href="#schedule" data-section="schedule">Schedule</a>
      <a href="#committee" data-section="committee">Committee</a>
      <a href="#members" data-section="members">Members</a>
      <a href="#gallery" data-section="gallery">Gallery</a>
      <a href="#faqs" data-section="faqs">FAQs</a>
      <a href="#sponsors" data-section="sponsors">Sponsors</a>
      <a href="#achievements" data-section="achievements">Achievements</a>
      <a href="#judges" data-section="judges">Judges / Mentors</a>
      <a href="#testimonials" data-section="testimonials">Testimonials</a>
      <a href="#travelInfo" data-section="travelInfo">Travel &amp; Stay</a>
      <a href="#codeOfConduct" data-section="codeOfConduct">Code of Conduct</a>
      <a href="#downloads" data-section="downloads">Downloads</a>
      <a href="#announcements" data-section="announcements">Announcements</a>
      <a href="#liveUpdates" data-section="liveUpdates">Live Updates</a>
      <a href="#contactInfo" data-section="contactInfo">Contact Info</a>
      <a href="#editions" data-section="editions">Symposium Editions</a>
    </nav>
    <button class="logout-btn" id="logoutBtn">Log Out</button>
  </aside>

  <main class="admin-main">
    <header class="admin-topbar">
      <div>
        <h1 id="sectionTitle">Overview</h1>
        <p id="sectionSub">Welcome back<span id="adminNameSpan"></span>.</p>
      </div>
      <div class="edition-switcher">
        <label for="editionSelect">Editing:</label>
        <select id="editionSelect"></select>
      </div>
    </header>

    <div id="overviewCards" class="overview-cards"></div>

    <div class="section-toolbar" id="sectionToolbar" style="display:none">
      <button class="btn-primary" id="addNewBtn">+ Add New</button>
    </div>

    <div id="contentArea"></div>
  </main>
</div>

<!-- Modal for add/edit forms -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="modalTitle">Add Entry</h3>
      <button id="modalClose" aria-label="Close">×</button>
    </div>
    <form id="modalForm"></form>
  </div>
</div>

<script src="assets/admin.js"></script>
</body>
</html>
