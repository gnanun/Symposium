<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Symposium 2.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/admin.css">
</head>
<body class="login-body">

<div class="login-card">
  <div class="login-brand">
    <span class="brand-mark">CC</span>
    <div>
      <strong>Symposium 2.0</strong>
      <small>Admin Panel</small>
    </div>
  </div>

  <h1>Sign in</h1>
  <p class="login-sub">For Creative Codex committee members only.</p>

  <form id="loginForm">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" required autocomplete="username">

    <label for="password">Password</label>
    <input type="password" id="password" name="password" required autocomplete="current-password">

    <button type="submit" class="btn-primary" id="loginBtn">Sign In</button>
    <p class="login-error" id="loginError"></p>
  </form>

  <p class="login-note">EDIT: API_BASE_URL must be set in assets/admin.js before this works. Admin accounts are created via the <code>create-admin</code> script on the server — see backend README.</p>
</div>

<script src="assets/admin.js"></script>
<script>
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const errorEl = document.getElementById('loginError');
    const btn = document.getElementById('loginBtn');
    errorEl.textContent = '';
    btn.textContent = 'Signing in...';
    btn.disabled = true;

    try {
      const res = await fetch(`${window.API_BASE_URL}/api/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Login failed.');

      localStorage.setItem('symposium_admin_token', data.token);
      localStorage.setItem('symposium_admin_name', data.admin.name);
      window.location.href = 'dashboard.html';
    } catch (err) {
      errorEl.textContent = err.message;
      btn.textContent = 'Sign In';
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
